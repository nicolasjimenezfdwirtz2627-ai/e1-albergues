services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgresAdmin
      POSTGRES_PASSWORD: postgres123
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - red
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - red
    depends_on:
      - db



networks:
  red:
    driver: bridge

volumes:
  db_data: